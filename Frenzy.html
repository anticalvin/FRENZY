<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frenzy</title>
<style>
:root{--bg:#000;--fg:#fff;--mut:rgba(255,255,255,.55);--gl:rgba(255,255,255,.08);--gb:rgba(255,255,255,.2);--hi:rgba(255,255,255,.38);--ind:rgba(255,255,255,.17);--ac:#fff;--f:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--fh:var(--f);--sp:cubic-bezier(.3,1.5,.5,1);box-sizing:border-box;color-scheme:dark}
:root[data-theme=light]{--bg:#fff;--fg:#000;--mut:rgba(0,0,0,.5);--gl:rgba(255,255,255,.6);--gb:rgba(0,0,0,.1);--hi:rgba(255,255,255,.9);--ind:rgba(0,0,0,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.glass{background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 18px rgba(255,255,255,.04),0 10px 34px rgba(0,0,0,.22)}
.pill{border-radius:99px;padding:8px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .35s var(--sp),background .2s}
.pill:active,.sq-b:active,.tile:active{transform:scale(.9)}
.pill.on{background:var(--fg);color:var(--bg)}
.big{width:100%;justify-content:center;padding:14px;font-size:15px;margin-top:14px}.big[disabled]{opacity:.35}
.view{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 130px;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#feed{overflow:hidden;padding:0}#me{padding-top:0}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:30}
#top b{font-family:var(--fh);font-size:20px;letter-spacing:-.04em;padding:8px 16px}
#top div{display:flex;gap:8px}
/* liquid tab bar */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:2px;padding:6px;border-radius:99px;z-index:30;max-width:calc(100vw - 20px);touch-action:none;user-select:none;-webkit-user-select:none}
#tabs button{position:relative;z-index:2;padding:10px 13px;border-radius:99px;font-size:13px;color:var(--mut);transition:color .25s}
#tabs button.on{color:var(--fg)}
#tabs button.plus{font-size:20px;line-height:1;padding:7px 15px;color:var(--fg)}
#ind{position:absolute;top:6px;bottom:6px;left:0;width:60px;border-radius:99px;z-index:1;background:var(--ind);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),inset 0 -8px 14px rgba(255,255,255,.07),0 6px 16px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(4px) brightness(1.3) saturate(1.6);backdrop-filter:blur(4px) brightness(1.3) saturate(1.6);pointer-events:none;scale:1;transition:transform .5s var(--sp),width .5s var(--sp),scale .35s var(--sp)}
#tabs.press #ind{scale:1.12 1.22}
/* drum */
.drum{position:relative;width:100%;height:100%;perspective:1100px;touch-action:pan-x;overflow:hidden;user-select:none;-webkit-user-select:none}
.drum.sm{touch-action:pan-y}
.card{position:absolute;left:50%;top:50%;border-radius:18px;overflow:hidden;background:#222;will-change:transform,opacity;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card img,.card video,.card canvas{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.note{width:100%;height:100%;padding:8%;display:flex;align-items:center;font-family:var(--fh);font-size:clamp(14px,3.4vw,22px);line-height:1.2;letter-spacing:-.02em;color:#000;background:#f2f2f2;overflow:hidden}
.lab{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;z-index:200;pointer-events:none;max-width:22%;line-height:1.15;mix-blend-mode:difference;color:#fff}
.lab.l{left:14px}.lab.r{right:14px;text-align:right}
.stp{position:absolute;right:10px;z-index:200;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px}.stp.u{top:calc(50% - 44px)}.stp.d{top:calc(50% + 6px)}
.flat{max-width:520px;margin:0 auto;padding:70px 14px 130px;height:100%;overflow-y:auto}
.fp{margin-bottom:28px}.fp .m{border-radius:20px;overflow:hidden;background:#222;cursor:pointer;margin:0 auto;position:relative}
.fp .m>*,.m>.cw{width:100%;height:100%}.fp .m img,.fp .m video{object-fit:cover;display:block;width:100%;height:100%}
.fp .t{display:flex;justify-content:space-between;padding:10px 4px;font-size:14px}.fp .t span{color:var(--mut)}
/* media bits */
.cw{position:relative;width:100%;height:100%}
.car{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative}
.sl>img,.sl>video,.sl>.p5,.sl>.note{width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:5px 8px;border-radius:99px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:.25s var(--sp)}.dots i.on{background:#fff;transform:scale(1.25)}
.arr{display:none;position:absolute;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;place-items:center;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:3}.arr.p{left:8px}.arr.n{right:8px}
@media(pointer:fine){.cw:hover .arr{display:grid}}
.p5{background:radial-gradient(circle at 30% 20%,#2a2a2a,#0a0a0a);position:relative;overflow:hidden}
.p5:empty::after{content:"p5";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.25);font:600 18px ui-monospace,monospace}
.p5 iframe{border:0;width:100%;height:100%;display:block;pointer-events:none}.p5.act iframe{pointer-events:auto}
/* sheets */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60px) scale(.96);opacity:0}}
.sh{width:min(560px,100%);max-height:92vh;overflow-y:auto;border-radius:30px 30px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 24px);animation:up .5s var(--sp);background:color-mix(in srgb,var(--bg) 72%,transparent)}
.sh h3{margin:0 0 14px;font-family:var(--fh);font-size:22px;letter-spacing:-.03em}
.vw{padding:0;display:flex;flex-direction:column;max-height:95vh;overflow:hidden}
.dz{touch-action:pan-x;padding:0 14px 10px;cursor:grab}.grab{height:30px;display:flex;justify-content:center;align-items:center;position:relative}.grab::before{content:"";width:40px;height:5px;border-radius:9px;background:var(--mut);opacity:.6}
.grab button{position:absolute;right:0;top:2px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--gl)}
.vf{margin:0 auto;border-radius:20px;overflow:hidden;background:#111;position:relative}
.vi{padding:6px 20px calc(env(safe-area-inset-bottom,0px) + 24px);overflow-y:auto;flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mut{color:var(--mut);font-size:13px}
.cm{padding:6px 0;font-size:14px}
input,textarea,select{width:100%;background:var(--gl);border:1px solid var(--gb);border-radius:14px;padding:11px 13px;margin:5px 0;outline:none}
input[type=color]{padding:2px;height:38px;width:60px}input[type=file]{display:none}
textarea{min-height:70px;resize:vertical}.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:190px;white-space:pre}
label.k{display:block;font-size:12px;color:var(--mut);margin-top:12px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--gb)}.sw.on{outline:2px solid var(--fg);outline-offset:2px}
/* publish */
.pfr{margin:4px auto 12px;border-radius:18px;overflow:hidden;background:#1a1a1a;position:relative;transition:width .4s var(--sp),aspect-ratio .4s}
.dropz{display:grid;place-items:center;text-align:center;gap:4px;padding:22px;border:1.5px dashed var(--gb);border-radius:20px;cursor:pointer;color:var(--mut);font-size:14px}.dropz.hot{border-color:var(--fg);color:var(--fg)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.tile{flex:0 0 70px;height:70px;border-radius:14px;overflow:hidden;position:relative;background:#222;transition:transform .35s var(--sp)}
.tile>img,.tile>video{width:100%;height:100%;object-fit:cover}.tile .tx{display:grid;place-items:center;height:100%;font:600 12px ui-monospace,monospace;color:#999}
.tile b{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:grid;place-items:center}
.tile u{position:absolute;bottom:2px;left:2px;right:2px;display:flex;justify-content:space-between;text-decoration:none;color:#fff;font-size:12px}
/* explore */
.ex{position:sticky;top:-14px;z-index:5;padding:14px 12px 8px;background:linear-gradient(var(--bg) 70%,transparent)}
.ex input{border-radius:99px;margin:0 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips .pill{flex:none}
.mas{columns:2;column-gap:6px;padding:0 6px}
@media(min-width:700px){.mas{columns:3}}@media(min-width:1100px){.mas{columns:4}}
.mas .it{break-inside:avoid;margin-bottom:6px;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;background:#1a1a1a;transition:transform .4s var(--sp)}
.mas .it:active{transform:scale(.97)}
.mas .it>*:not(i):not(s){width:100%;height:100%;display:block;object-fit:cover}
.mas .it i{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:12px;padding:4px 9px;border-radius:99px;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:.25s}.mas .it:hover i{opacity:1}
.mas .it s{position:absolute;top:8px;right:8px;text-decoration:none;font-size:11px;padding:3px 8px;border-radius:99px;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* profile */
.bn{height:calc(190px + env(safe-area-inset-top,0px));width:100%}
.pf{max-width:620px;margin:0 auto;padding:0 16px}
.ph{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}.ph.nb{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}.ph.hb{margin-top:-70px;padding-top:0;position:relative}
.av{width:140px;height:140px;overflow:hidden;border:4px solid var(--bg);background:#222;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font-family:var(--fh);font-size:38px;letter-spacing:-.05em;margin:14px 0 0;line-height:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.bio{line-height:1.5;max-width:46ch;margin:12px 0}
.stats{display:flex;gap:22px;margin:14px 0;font-size:14px}.stats b{display:block;font-size:20px;letter-spacing:-.03em}
.now{border-radius:22px;padding:14px 16px;margin:14px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.now span{color:var(--mut)}
.ctr{text-align:center}.ctr .av{margin:0 auto}.ctr .row,.ctr .lk,.ctr .stats{justify-content:center}.ctr .bio{margin-left:auto;margin-right:auto}.ctr .now{text-align:left}
.work{margin:18px -16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.g{aspect-ratio:1;overflow:hidden;cursor:pointer;background:#222;position:relative}.g>*:not(i){width:100%;height:100%;object-fit:cover;display:block}
.contact{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:#111;border-radius:14px;margin:0 16px}
.contact .g{aspect-ratio:3/2;filter:grayscale(1) contrast(1.1)}.contact .g i{position:absolute;bottom:2px;right:4px;font:10px ui-monospace,monospace;color:#ff9a3c;font-style:normal}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:78px;gap:4px;grid-auto-flow:dense}
.mosaic .g{aspect-ratio:auto}.mosaic .g:nth-child(5n+1){grid-column:span 2;grid-row:span 2}.mosaic .g:nth-child(7n+3){grid-row:span 2}
.pdrum{height:440px}
.sec{display:flex;gap:6px;margin:22px 0 14px;overflow-x:auto}
.board{display:flex;margin:0 0 18px}.board img{width:64px;height:80px;object-fit:cover;border-radius:10px;margin-right:-18px;border:2px solid var(--bg)}.board div{margin-left:32px;align-self:center}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.br{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:16px;margin:6px 0;font-size:14px}.br span{flex:1}.br button{width:32px;height:32px;border-radius:50%;background:var(--gl)}.br .ey{width:auto;padding:0 12px;font-size:12px;border-radius:99px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:99;padding:10px 18px;border-radius:99px;font-size:13px;animation:up .5s var(--sp)}
</style></head><body>
<div id="top"><b class="glass pill">frenzy</b><div><button class="glass pill" id="mode">Drum</button><button class="glass pill" id="theme">Light</button></div></div>
<main>
<section class="view on" id="feed"></section>
<section class="view" id="explore"><div class="ex"><input class="glass" id="q" placeholder="Search"><div class="chips" id="chips"></div></div><div class="mas" id="mas"></div></section>

</nav>
<script>

  else{pos+=vel;vel*=.93;if(pos<-.3||pos>list.length-.7)vel*=.5;if(Math.abs(vel)<.004){pos+=(clamp(Math.round(pos),0,list.length-1)-pos)*.18;vel=0}}}
