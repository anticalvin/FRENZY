  cards.forEach((c,i)=>{const d=i-pos,a=Math.abs(d);
  c.style.transform=`translate(-50%,-50%) translateY(${Y[i]}px) rotateX(${-d*40}deg) scale(${Math.max(.3,1-a*.15)})`;
  c.style.opacity=Math.max(0,1-a*.27);c.style.filter=a>.35?`blur(${Math.min(a,3)*.7}px)`:'';c.style.zIndex=100-Math.round(a*10);c.style.visibility=a>3.6?'hidden':'visible';
